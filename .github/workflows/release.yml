name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.determine.outputs.version }}
      tag: ${{ steps.determine.outputs.tag }}
      should-release: ${{ steps.determine.outputs.should-release }}
    steps:
      - name: CI must have passed on main or a tag
        shell: pwsh
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_HEAD: ${{ github.event.workflow_run.head_branch }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_run") {
            if ($env:CI_CONCLUSION -ne "success") {
              throw "CI did not pass (conclusion: $env:CI_CONCLUSION) - release aborted."
            }
            if ($env:CI_HEAD -ne "main" -and $env:CI_HEAD -notmatch '^v\d+\.\d+\.\d+$') {
              throw "CI run is not on main or a semver tag (head: $env:CI_HEAD) - release aborted."
            }
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Determine version
        id: determine
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_HEAD: ${{ github.event.workflow_run.head_branch }}
        run: |
          $shouldRelease = "true"
          if ($env:CI_HEAD -like "v*") {
            if ($env:CI_HEAD -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Tag $env:CI_HEAD is not a valid semver tag (expected vMAJOR.MINOR.PATCH)."
            }
            $version = $env:CI_HEAD.TrimStart('v')
            $existing = gh release list --limit 1000 --json tagName --jq '.[].tagName' 2>$null
            if ($existing -contains $env:CI_HEAD) {
              $shouldRelease = "false"
              Write-Host "Release $env:CI_HEAD already exists - skipping."
            }
          }
          else {
            $tags = git tag --list 'v*' 2>$null
            $latest = $tags | Where-Object { $_ -match '^v?\d+\.\d+\.\d+$' } |
              Sort-Object { [version]$_.TrimStart('v') } | Select-Object -Last 1
            if ($latest) {
              $parts = $latest.TrimStart('v').Split('.')
              $version = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
            }
            else {
              $version = "0.1.0"
            }
          }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File $env:GITHUB_OUTPUT -Append
          "should-release=$shouldRelease" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version (ci head: $env:CI_HEAD)"

  build-server:
    name: Publish server (${{ matrix.rid }})
    needs: version
    if: needs.version.outputs.should-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Provision lualsp (${{ matrix.rid }})
        shell: pwsh
        run: .\.github\tools\fetch-lualsp.ps1 -Rid ${{ matrix.rid }} -Update

      - name: Publish NativeAOT
        shell: pwsh
        run: |
          dotnet publish src/LuaHelperMcpServer -c Release -r ${{ matrix.rid }} --self-contained `
            -p:PublishAot=true -p:InvariantGlobalization=true -p:Version=$env:VERSION -o publish/${{ matrix.rid }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path publish/${{ matrix.rid }}/lualsp/${{ matrix.rid }} -Force | Out-Null
          if ("${{ matrix.rid }}".StartsWith("win")) {
            Copy-Item lualsp/${{ matrix.rid }}/lualsp.exe publish/${{ matrix.rid }}/lualsp/${{ matrix.rid }}/lualsp.exe -Force
          } else {
            Copy-Item lualsp/${{ matrix.rid }}/lualsp publish/${{ matrix.rid }}/lualsp/${{ matrix.rid }}/lualsp -Force
            chmod +x publish/${{ matrix.rid }}/LuaHelperMcpServer publish/${{ matrix.rid }}/lualsp/${{ matrix.rid }}/lualsp
          }
          Copy-Item lualsp/version.json publish/${{ matrix.rid }}/lualsp/version.json -Force

      - name: MCP handshake smoke test
        shell: pwsh
        run: |
          if ("${{ matrix.rid }}".StartsWith("win")) {
            .\.github\tools\smoke-test-mcp.ps1 -ServerPath publish/${{ matrix.rid }}/LuaHelperMcpServer.exe -ExpectedVersion $env:VERSION
          } else {
            .\.github\tools\smoke-test-mcp.ps1 -ServerPath publish/${{ matrix.rid }}/LuaHelperMcpServer -ExpectedVersion $env:VERSION
          }

      - name: Zip release assets
        shell: pwsh
        run: |
          $asset = "luahelper-mcp-server-${{ matrix.rid }}-$env:VERSION.zip"
          Push-Location publish/${{ matrix.rid }}
          Compress-Archive -Path * -DestinationPath $asset -Force
          Pop-Location

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luahelper-mcp-server-${{ matrix.rid }}-${{ needs.version.outputs.version }}.zip
          path: publish/${{ matrix.rid }}/luahelper-mcp-server-${{ matrix.rid }}-*.zip
          retention-days: 14

  build-vsix:
    name: Package VS Code extension
    needs: version
    if: needs.version.outputs.should-release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build VSIX
        shell: pwsh
        run: .\.github\tools\build-vsix.ps1 -Version $env:VERSION

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luahelper-mcp-${{ needs.version.outputs.version }}.vsix
          path: vscode-extension/luahelper-mcp-*.vsix
          retention-days: 14

  release:
    name: Create GitHub release
    needs: [version, build-server, build-vsix]
    if: needs.version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --json tagName -q .tagName 2>/dev/null; then
            echo "Release $TAG already exists - skipping."
            exit 0
          fi
          ASSETS=""
          for f in artifacts/*/*.zip artifacts/*/*.vsix; do
            [ -f "$f" ] && ASSETS="$ASSETS $f"
          done
          {
            echo "LuaHelper MCP Server $VERSION"
            echo ""
            echo "- **luahelper-mcp-server-{rid}-$VERSION.zip** - NativeAOT single-file binary + bundled lualsp per platform (win-x64, linux-x64, osx-x64)"
            echo "- **luahelper-mcp-$VERSION.vsix** - VS Code extension (one-click install, auto-registers the MCP server)"
            echo ""
            echo "See the README: https://github.com/CoffeeNova/luahelper-mcp#readme"
          } > /tmp/release-notes.md
          gh release create "$TAG" $ASSETS \
            --title "LuaHelper MCP Server $VERSION" \
            --notes-file /tmp/release-notes.md
